python3 -c "from pathlib import Path; Path('starter/.github/workflows/backend-ci.yaml').write_text('''name: Backend CI
on:
  pull_request:
    branches:
      - main
    paths:
      - \"starter/backend/**\"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \"3.10\"
      - run: pip install pipenv
      - working-directory: starter/backend
        run: pipenv install
      - working-directory: starter/backend
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \"3.10\"
      - run: pip install pipenv
      - working-directory: starter/backend
        run: pipenv install
      - working-directory: starter/backend
        run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: starter/backend
        run: docker build -t backend-app .
''')"
